    <!-- Main Workspace -->

        <!-- Chat Stream Workspace -->

                    <div class="theme-bg-card border theme-border rounded-xl p-3 text-xs opacity-90 space-y-1.5 theme-glow">

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DEFAULT_SYSTEM_PROMPT = "Your name is strictly D.o.o.m. You were created by Atharva. You run on openai/gpt-oss-120b via Groq API. Respond concisely and professionally.";
        
        let apiKey = localStorage.getItem('groq_api_key') || '';
        let systemPrompt = localStorage.getItem('doom_system_prompt') || DEFAULT_SYSTEM_PROMPT;
        let conversations = JSON.parse(localStorage.getItem('doom_conversations')) || [
            { id: 1, title: 'Session #1', messages: [] }
        ];
        let activeChatId = conversations[0].id;
        let ttsEnabled = true;
        let isImageMode = false;
        let currentAttachment = null;
        let recognition = null;
        let isListening = false;
        let deferredPrompt = null;

        // Register Service Worker for PWA compliance
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        // PWA Install Prompt Listener
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('pwa-install-btn');
            if (btn) btn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('pwa-install-btn').classList.add('hidden');
                });
            }
        }

        function triggerHaptic(type = 'light') {
            if ('vibrate' in navigator) {
                if (type === 'light') navigator.vibrate(12);
                else if (type === 'success') navigator.vibrate([10, 30, 20]);
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = `${window.visualViewport.height}px`;
                scrollToBottom();
            });
        }

        document.getElementById('groq-api-key').value = apiKey;
        document.getElementById('custom-system-prompt').value = systemPrompt;
        
        const savedTheme = localStorage.getItem('doom_theme') || 'emerald';
        setTheme(savedTheme);

        renderHistory();
        initFrontHeaderTelemetry();
        initVoiceRecognition();

        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        function scrollToBottom() {
            setTimeout(() => {
                const chatStream = document.getElementById('chat-stream');
                if (chatStream) chatStream.scrollTop = chatStream.scrollHeight;
            }, 100);
        }

        function toggleSidebar() {
            triggerHaptic();
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = !sidebar.classList.contains('-translate-x-full');

            if (isOpen) closeSidebar();
            else {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.add('opacity-0', 'pointer-events-none');
        }

        function setTheme(theme) {
            triggerHaptic();
            document.body.className = theme === 'emerald' ? 'h-[100dvh] flex flex-col overflow-hidden' : `h-[100dvh] flex flex-col overflow-hidden theme-${theme}`;
            localStorage.setItem('doom_theme', theme);
        }

        function toggleImageMode(forceState) {
            isImageMode = forceState !== undefined ? forceState : !isImageMode;
            const badge = document.getElementById('image-mode-badge');
            const btn = document.getElementById('img-mode-btn');

            if (isImageMode) {
                badge.classList.remove('hidden');
                btn.classList.add('theme-accent-bg', 'text-white');
            } else {
                badge.classList.add('hidden');
                btn.classList.remove('theme-accent-bg', 'text-white');
            }
        }

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type === 'application/pdf') {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                    const pdf = await loadingTask.promise;
                    let fullText = '';
                    
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += `--- PAGE ${i} ---\n${pageText}\n\n`;
                    }

                    if (!fullText.trim()) {
                        alert("This PDF appears to be a scanned image or contains non-extractable text.");
                        return;
                    }

                    currentAttachment = {
                        name: file.name,
                        type: 'pdf',
                        content: fullText.substring(0, 15000)
                    };
                    showAttachmentBadge(file.name);
                    triggerHaptic('success');
                } catch (err) {
                    alert('Error parsing PDF: ' + err.message);
                }
            } else {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentAttachment = {
                        name: file.name,
                        type: 'text',
                        content: event.target.result.substring(0, 15000)
                    };
                    showAttachmentBadge(file.name);
                    triggerHaptic('success');
                };
                reader.readAsText(file);
            }
        }

        function showAttachmentBadge(filename) {
            document.getElementById('attached-filename').innerText = filename;
            document.getElementById('attachment-preview-bar').classList.remove('hidden');
        }

        function removeAttachment() {
            currentAttachment = null;
            document.getElementById('file-input').value = '';
            document.getElementById('attachment-preview-bar').classList.add('hidden');
        }

        function initFrontHeaderTelemetry() {
            function updateClock() {
                const now = new Date();
                document.getElementById('header-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('header-date').innerText = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
            updateClock();
            setInterval(updateClock, 1000);

            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    const updateBattery = () => {
                        const level = Math.round(battery.level * 100);
                        document.getElementById('header-battery').innerHTML = `<i class="fa-solid fa-battery-half mr-0.5"></i>${level}%${battery.charging ? '⚡' : ''}`;
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                });
            } else {
                document.getElementById('header-battery').innerText = '100%';
            }

            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    try {
                        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const geoData = await geoRes.json();
                        const city = geoData.address.city || geoData.address.town || geoData.address.village || 'Local';
                        document.getElementById('header-location').innerHTML = `<i class="fa-solid fa-location-dot mr-0.5"></i>${city}`;
                    } catch (e) {
                        document.getElementById('header-location').innerHTML = `<i class="fa-solid fa-location-dot mr-0.5"></i>City Active`;
                    }

                    try {
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const weatherData = await weatherRes.json();
                        const temp = Math.round(weatherData.current_weather.temperature);
                        document.getElementById('header-weather').innerHTML = `<i class="fa-solid fa-cloud-sun mr-0.5"></i>${temp}°C`;
                    } catch (e) {
                        document.getElementById('header-weather').innerHTML = `<i class="fa-solid fa-sun mr-0.5"></i>22°C`;
                    }
                }, () => {
                    document.getElementById('header-location').innerHTML = `<i class="fa-solid fa-location-dot mr-0.5"></i>Location Denied`;
                    document.getElementById('header-weather').innerHTML = `<i class="fa-solid fa-cloud mr-0.5"></i>--`;
                });
            }
        }

        function initVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.onstart = () => {
                    isListening = true;
                    document.getElementById('mic-btn').classList.add('bg-red-900', 'text-red-400');
                };
                recognition.onresult = (e) => {
                    document.getElementById('user-input').value = e.results[0][0].transcript;
                    stopVoiceInput();
                };
                recognition.onerror = () => stopVoiceInput();
                recognition.onend = () => stopVoiceInput();
            } else {
                document.getElementById('mic-btn').style.display = 'none';
            }
        }

        function toggleVoiceInput() {
            if (!recognition) return;
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function stopVoiceInput() {
            isListening = false;
            document.getElementById('mic-btn').classList.remove('bg-red-900', 'text-red-400');
        }

        function toggleTTS() {
            triggerHaptic();
            ttsEnabled = !ttsEnabled;
            const btn = document.getElementById('tts-toggle');
            const icon = document.getElementById('tts-icon');

            if (!ttsEnabled) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                btn.classList.add('opacity-40');
                btn.classList.remove('theme-text-accent');
                icon.className = 'fa-solid fa-volume-xmark';
            } else {
                btn.classList.remove('opacity-40');
                btn.classList.add('theme-text-accent');
                icon.className = 'fa-solid fa-volume-high';
            }
        }

        function speakText(text) {
            if (!ttsEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            // Clean markdown syntax, code blocks, URLs, and vocalized punctuation like asterisks, dashes, commas, etc.
            let cleanText = text
                .replace(/```[\s\S]*?```/g, '') // remove code blocks
                .replace(/`([^`]+)`/g, '$1')     // inline code
                .replace(/https?:\/\/\S+/g, '')  // links
                .replace(/[#*`_~=\-\+\\\/\|\[\]\(\)\{\}<>]/g, ' ') // markdown symbols & punctuation
                .replace(/,/g, ' ')               // remove commas so TTS doesn't say "comma"
                .replace(/\s+/g, ' ')            // normalize whitespace
                .trim();

            if (!cleanText) return;

            const utterance = new SpeechSynthesisUtterance(cleanText);
            window.speechSynthesis.speak(utterance);
        }

        function toggleConfigModal() {
            triggerHaptic();
            document.getElementById('config-modal').classList.toggle('hidden');
        }

        function resetSystemPrompt() {
            document.getElementById('custom-system-prompt').value = DEFAULT_SYSTEM_PROMPT;
        }

        function saveConfig() {
            triggerHaptic('success');
            apiKey = document.getElementById('groq-api-key').value.trim();
            systemPrompt = document.getElementById('custom-system-prompt').value.trim() || DEFAULT_SYSTEM_PROMPT;
            
            localStorage.setItem('groq_api_key', apiKey);
            localStorage.setItem('doom_system_prompt', systemPrompt);
            toggleConfigModal();
        }

        function renderHistory() {
            const list = document.getElementById('chat-history-list');
            list.innerHTML = '';
            conversations.forEach(chat => {
                const btn = document.createElement('div');
                btn.className = `w-full p-2 rounded text-xs flex items-center justify-between border ${chat.id === activeChatId ? 'theme-bg-card theme-border theme-text-accent' : 'theme-bg-sec theme-border opacity-70'}`;
                btn.innerHTML = `
                    <span class="truncate cursor-pointer flex-1" onclick="switchChat(${chat.id})">${escapeHtml(chat.title)}</span>
                    <button onclick="deleteChat(${chat.id}, event)" class="opacity-50 hover:opacity-100 hover:text-red-400 ml-1.5"><i class="fa-solid fa-trash text-[10px]"></i></button>
                `;
                list.appendChild(btn);
            });
        }

        function createNewChat() {
            triggerHaptic();
            const newId = Date.now();
            conversations.unshift({ id: newId, title: `Session #${conversations.length + 1}`, messages: [] });
            saveState();
            switchChat(newId);
            closeSidebar();
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            triggerHaptic();
            if (conversations.length <= 1) return;
            conversations = conversations.filter(c => c.id !== id);
            if (activeChatId === id) activeChatId = conversations[0].id;
            saveState();
            switchChat(activeChatId);
        }

        function switchChat(id) {
            triggerHaptic();
            activeChatId = id;
            renderHistory();
            const chat = conversations.find(c => c.id === id);
            document.getElementById('current-chat-title').innerText = chat.title;
            
            const chatStream = document.getElementById('chat-stream');
            chatStream.innerHTML = '';
            
            if (chat.messages.length === 0) {
                chatStream.innerHTML = `
                    <div class="flex items-start space-x-2 max-w-full">
                        <div class="w-7 h-7 rounded theme-bg-card border theme-border flex items-center justify-center theme-text-accent text-[10px] font-mono flex-shrink-0">AI</div>
                        <div class="theme-bg-card border theme-border rounded-xl p-3 text-xs opacity-90 space-y-1 theme-glow">
                            <p class="font-semibold theme-text-accent font-mono text-[11px]">NEW SESSION</p>
                            <p>Query <span class="doom-highlight">D.o.o.m</span> or attach PDF files.</p>
                        </div>
                    </div>`;
            } else {
                chat.messages.forEach(msg => renderMessage(msg.role, msg.displayContent || msg.content, false, msg.type));
            }
            closeSidebar();
            scrollToBottom();
        }

        function clearCurrentChat() {
            triggerHaptic();
            if (confirm("Clear all messages in current session?")) {
                const chat = conversations.find(c => c.id === activeChatId);
                if (chat) { chat.messages = []; saveState(); switchChat(activeChatId); }
            }
        }

        function rebootMemory() {
            triggerHaptic();
            if (confirm("Reboot total AI memory? All saved chats will be reset.")) {
                conversations = [{ id: Date.now(), title: 'Session #1', messages: [] }];
                activeChatId = conversations[0].id;
                saveState();
                switchChat(activeChatId);
                closeSidebar();
            }
        }

        function loadTemplate(type) {
            triggerHaptic();
            const input = document.getElementById('user-input');
            if (type === 'gen_image') {
                toggleImageMode(true);
                input.value = "Cyberpunk neon city with glowing green terminal lines, hyper realistic 8k";
            } else if (type === 'architecture') {
                input.value = "Draft system architecture for high-throughput engine.";
            } else if (type === 'debug') {
                input.value = "Analyze execution logs and pinpoint latency bottlenecks.";
            }
            closeSidebar();
        }

        function handleSend() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message && !currentAttachment) return;

            const isImageReq = isImageMode || message.toLowerCase().startsWith('/image') || message.toLowerCase().includes('generate image');

            if (isImageReq) {
                const prompt = message.replace(/^\/image/i, '').replace(/generate image/i, '').trim() || message;
                generateImage(prompt);
                toggleImageMode(false);
            } else {
                let fullPayload = message;
                let userDisplayMsg = message;

                if (currentAttachment) {
                    userDisplayMsg = `[Attached File: ${currentAttachment.name}]\n${message}`;
                    fullPayload = `[Attached File Content: ${currentAttachment.name}]\n${currentAttachment.content}\n\n[User Instruction]: ${message}`;
                }

                sendMessage(fullPayload, userDisplayMsg);
                removeAttachment();
            }
            input.value = '';
        }

        function generateImage(prompt) {
            const chat = conversations.find(c => c.id === activeChatId);
            if (chat.messages.length === 0) chat.title = 'Image: ' + prompt.substring(0, 12);

            renderMessage('user', `Generate image: ${prompt}`);
            chat.messages.push({ role: 'user', content: `Generate image: ${prompt}`, type: 'text' });

            const enhancedPrompt = `${prompt}, highly detailed, 8k resolution, cinematic lighting, masterpiece, photorealistic`;
            const seed = Math.floor(Math.random() * 10000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true&enhance=true`;

            renderMessage('assistant', imageUrl, false, 'image');
            chat.messages.push({ role: 'assistant', content: imageUrl, type: 'image' });
            saveState();
        }

        async function sendMessage(apiPayload, userDisplayMsg) {
            const chat = conversations.find(c => c.id === activeChatId);
            if (chat.messages.length === 0) chat.title = userDisplayMsg.substring(0, 18) + '...';

            renderMessage('user', userDisplayMsg);
            chat.messages.push({ role: 'user', content: apiPayload, displayContent: userDisplayMsg, type: 'text' });
            saveState();

            if (!apiKey) {
                renderApiKeyGuideMessage();
                return;
            }

            renderMessage('assistant', "Processing request...", true);

            const sysMsg = { role: "system", content: systemPrompt };
            const apiMessages = [sysMsg, ...chat.messages.filter(m => m.type !== 'image').map(m => ({ role: m.role, content: m.content }))];

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: apiMessages,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                removeLoadingBubble();

                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    renderMessage('assistant', aiReply);
                    chat.messages.push({ role: 'assistant', content: aiReply, type: 'text' });
                    saveState();
                    speakText(aiReply);
                    triggerHaptic('success');
                } else {
                    renderMessage('assistant', `API Error: ${data.error ? data.error.message : 'Invalid response'}`);
                }
            } catch (err) {
                removeLoadingBubble();
                renderMessage('assistant', `Network Error: ${err.message}`);
            }
        }

        function renderApiKeyGuideMessage() {
            const chatStream = document.getElementById('chat-stream');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start space-x-2 max-w-full';
            wrapper.innerHTML = `
                <div class="w-7 h-7 rounded theme-bg-card border theme-border flex items-center justify-center theme-text-accent text-[10px] font-mono flex-shrink-0">AI</div>
                <div class="theme-bg-card border border-amber-800/60 rounded-xl p-3 text-xs space-y-2">
                    <p class="font-semibold text-amber-500 font-mono text-[11px]"><i class="fa-solid fa-key mr-1"></i>GROQ API KEY REQUIRED</p>
                    <p>Provide your Groq Key in Config to activate <span class="doom-highlight">D.o.o.m</span>.</p>
                    <button onclick="toggleConfigModal()" class="px-2.5 py-1 rounded theme-accent-bg text-white text-xs font-mono">
                        Set Key
                    </button>
                </div>
            `;
            chatStream.appendChild(wrapper);
            scrollToBottom();
        }

        function renderMessage(role, text, isLoading = false, type = 'text') {
            const chatStream = document.getElementById('chat-stream');
            const wrapper = document.createElement('div');
            
            if (role === 'user') {
                wrapper.className = 'flex items-start justify-end space-x-2 max-w-full ml-auto';
                wrapper.innerHTML = `
                    <div class="theme-user-msg border rounded-xl p-3 text-xs whitespace-pre-wrap">
                        <p>${escapeHtml(text)}</p>
                    </div>
                    <div class="w-7 h-7 rounded theme-accent-bg flex items-center justify-center text-white text-[10px] font-bold flex-shrink-0">YOU</div>
                `;
            } else {
                wrapper.className = 'flex items-start space-x-2 max-w-full';
                if (isLoading) wrapper.id = 'loading-bubble';

                let bodyContent = '';
                if (type === 'image') {
                    bodyContent = `
                        <p class="text-[10px] theme-text-accent font-mono mb-1"><i class="fa-solid fa-image mr-1"></i>Generated Image:</p>
                        <div class="rounded-lg overflow-hidden border theme-border mt-1">
                            <img src="${text}" alt="Generated image" class="w-full h-auto object-cover" loading="lazy" onload="scrollToBottom()">
                        </div>
                        <a href="${text}" target="_blank" download="doom_art.jpg" class="inline-block mt-1.5 text-[10px] font-mono theme-text-accent underline"><i class="fa-solid fa-download mr-1"></i>Save Image</a>
                    `;
                } else {
                    const parsedMarkdown = marked.parse(text);
                    bodyContent = `<div class="prose prose-invert max-w-none text-xs leading-relaxed">${parsedMarkdown}</div>`;
                }

                wrapper.innerHTML = `
                    <div class="w-7 h-7 rounded theme-bg-card border theme-border flex items-center justify-center theme-text-accent text-[10px] font-mono flex-shrink-0">AI</div>
                    <div class="theme-bg-card border theme-border rounded-xl p-3 text-xs opacity-90 space-y-1 theme-glow max-w-[88%] overflow-hidden">
                        <p class="font-semibold theme-text-accent font-mono text-[11px]"><span class="doom-highlight">D.o.o.m</span></p>
                        ${bodyContent}
                    </div>
                `;
            }
            chatStream.appendChild(wrapper);

            wrapper.querySelectorAll('pre code').forEach((block) => {
                const container = document.createElement('div');
                container.className = 'code-container';
                
                const lang = block.className.replace('hljs language-', '') || 'code';
                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `<span>${lang}</span><button onclick="copyCode(this)" class="opacity-70 hover:opacity-100"><i class="fa-regular fa-copy mr-1"></i>Copy</button>`;

                block.parentNode.parentNode.insertBefore(container, block.parentNode);
                container.appendChild(header);
                container.appendChild(block.parentNode);
            });

            scrollToBottom();
        }

        function copyCode(btn) {
            triggerHaptic();
            const code = btn.parentNode.nextElementSibling.querySelector('code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                btn.innerHTML = '<i class="fa-solid fa-check mr-1 theme-text-accent"></i>Copied!';
                setTimeout(() => {
                    btn.innerHTML = '<i class="fa-regular fa-copy mr-1"></i>Copy';
                }, 2000);
            });
        }

        function removeLoadingBubble() {
            const el = document.getElementById('loading-bubble');
            if (el) el.remove();
        }

        function saveState() {
            localStorage.setItem('doom_conversations', JSON.stringify(conversations));
            renderHistory();
        }

        function exportChatLog() {
            triggerHaptic();
            const chat = conversations.find(c => c.id === activeChatId);
            if (!chat) return;
            const logStr = JSON.stringify(chat, null, 2);
            const blob = new Blob([logStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${chat.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_export.json`;
            a.click();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
